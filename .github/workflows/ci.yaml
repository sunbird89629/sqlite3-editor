name: Test
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: viewer_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MYSQL_URL: mysql://root:root@127.0.0.1:3306/viewer_test
      MYSQL_ALLOW_WRITES: '1'
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - run: npm ci
      - run: cd ui && npx playwright install && cd ..
      - run: npm test
      - run: |
          cd vscode
          echo 'LICENSE' > LICENSE
          npx vsce package
